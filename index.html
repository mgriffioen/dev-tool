<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML & CSS Formatter — Email Dev Tools</title>

  <!-- js-beautify for formatting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-css.min.js"></script>

  <!-- Prism for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2e3245;
      --accent:    #4f6ef7;
      --accent-h:  #6b86ff;
      --success:   #3ecf8e;
      --text:      #e2e4f0;
      --muted:     #7b82a0;
      --radius:    8px;
      --font-ui:   'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-code: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label.control-label {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    select, input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 5px 8px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--accent);
    }

    input[type="number"] {
      width: 56px;
      text-align: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-family: var(--font-ui);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-h); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

    .btn-success {
      background: var(--success);
      color: #0f1117;
    }

    /* ── Panels ── */
    .panels {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    .panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .panel + .panel {
      border-left: 2px solid var(--border);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .panel-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .char-count {
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Input editor ── */
    .editor-wrap {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .line-gutter {
      background: var(--surface);
      border-right: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-code);
      font-size: 13px;
      line-height: 1.6;
      padding: 16px 10px 16px 8px;
      text-align: right;
      user-select: none;
      overflow: hidden;
      min-width: 42px;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      color: var(--text);
      border: none;
      outline: none;
      resize: none;
      padding: 16px;
      font-family: var(--font-code);
      font-size: 13px;
      line-height: 1.6;
      tab-size: 2;
      white-space: pre;
      overflow-x: auto;
      overflow-y: auto;
    }

    #input::placeholder { color: var(--muted); }

    /* ── Prism line-numbers overrides ── */
    pre.line-numbers { position: relative; padding-left: 52px !important; }
    .line-numbers .line-numbers-rows {
      border-right: 1px solid var(--border) !important;
      background: var(--surface);
      top: 0;
      font-size: 13px;
    }
    .line-numbers-rows > span::before { color: var(--muted) !important; }

    /* ── Output area ── */
    .output-wrap {
      flex: 1;
      overflow: auto;
      background: var(--bg);
      position: relative;
    }

    #output {
      margin: 0;
      padding: 16px;
      font-family: var(--font-code);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
      min-height: 100%;
      background: transparent;
    }

    /* Override Prism background */
    #output code[class*="language-"],
    #output pre[class*="language-"] {
      background: transparent !important;
      margin: 0;
      padding: 0;
      font-size: inherit;
      line-height: inherit;
    }

    /* Empty state */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      pointer-events: none;
    }

    .empty-state-icon { font-size: 32px; opacity: 0.4; }
    .empty-state-text { font-size: 13px; }

    /* ── Status bar ── */
    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .status-msg {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status-dot.ok  { background: var(--success); }
    .status-dot.err { background: #f56565; }

    /* ── Tooltip ── */
    [data-tip] { position: relative; }
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #2e3245;
      color: var(--text);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    [data-tip]:hover::after { opacity: 1; }

    /* ── Validation panel ── */
    .val-panel {
      background: var(--surface);
      border-top: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      max-height: 220px;
      transition: max-height 0.2s ease;
      overflow: hidden;
    }

    .val-panel.collapsed { max-height: 36px; }

    .val-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
      min-height: 36px;
    }

    .val-panel-header:hover { background: rgba(255,255,255,0.03); }

    .val-panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .val-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 7px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
    }

    .val-badge.error  { background: rgba(245,101,101,0.18); color: #f56565; }
    .val-badge.warn   { background: rgba(246,173,85,0.18);  color: #f6ad55; }
    .val-badge.info   { background: rgba(99,179,237,0.18);  color: #63b3ed; }
    .val-badge.ok     { background: rgba(62,207,142,0.15);  color: var(--success); }

    .val-toggle {
      font-size: 10px;
      color: var(--muted);
      transition: transform 0.2s;
    }

    .val-panel.collapsed .val-toggle { transform: rotate(-90deg); }

    .val-list {
      overflow-y: auto;
      padding: 0 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .val-issue {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 12px;
      line-height: 1.5;
    }

    .val-icon { flex-shrink: 0; font-size: 11px; }
    .val-issue.error .val-icon { color: #f56565; }
    .val-issue.warn  .val-icon { color: #f6ad55; }
    .val-issue.info  .val-icon { color: #63b3ed; }

    .val-msg  { color: var(--text); }
    .val-hint { color: var(--muted); }

    .val-lines {
      font-family: var(--font-code);
      font-size: 11px;
      color: var(--accent-h);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .val-empty {
      font-size: 12px;
      color: var(--success);
      padding: 4px 0 8px;
    }

    @media (max-width: 700px) {
      .panels { flex-direction: column; }
      .panel + .panel { border-left: none; border-top: 2px solid var(--border); }
      .controls { gap: 6px; }
      .control-group { display: none; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Header ── -->
  <header>
    <div class="logo">
      <div class="logo-icon">&#10094;/&#10095;</div>
      HTML &amp; CSS Formatter
    </div>

    <div class="controls">
      <div class="control-group">
        <label class="control-label" for="mode">Mode</label>
        <select id="mode">
          <option value="html">HTML</option>
          <option value="css">CSS</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label" for="indent-size">Indent</label>
        <input id="indent-size" type="number" value="2" min="1" max="8">
      </div>

<button class="btn btn-ghost" id="btn-clear" data-tip="Clear both panels">Clear</button>
      <button class="btn btn-ghost"  id="btn-validate" data-tip="Validate for email issues">Validate</button>
      <button class="btn btn-primary" id="btn-format">&#9654; Format</button>
    </div>
  </header>

  <!-- ── Panels ── -->
  <div class="panels">

    <!-- Input -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Input — paste your code here</span>
        <div class="panel-actions">
          <span class="char-count" id="input-count">0 chars</span>
          <button class="btn btn-ghost" id="btn-paste" data-tip="Paste from clipboard" style="padding:4px 10px;font-size:12px;">Paste</button>
        </div>
      </div>
      <div class="editor-wrap">
        <div class="line-gutter" id="input-gutter"></div>
        <textarea id="input" spellcheck="false"
          placeholder="Paste your messy HTML or CSS here…&#10;&#10;Tip: inline styles, nested tables, and email boilerplate are all handled."></textarea>
      </div>
    </div>

    <!-- Output -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Output — formatted &amp; highlighted</span>
        <div class="panel-actions">
          <span class="char-count" id="output-count"></span>
          <button class="btn btn-ghost" id="btn-copy" data-tip="Copy formatted code" style="padding:4px 10px;font-size:12px;">Copy</button>
        </div>
      </div>
      <div class="output-wrap">
        <div class="empty-state" id="empty-state">
          <div class="empty-state-icon">&#9707;</div>
          <div class="empty-state-text">Formatted output will appear here</div>
        </div>
        <pre id="output" class="line-numbers"><code id="output-code" class="language-markup"></code></pre>
      </div>
    </div>

  </div>

  <!-- ── Validation panel ── -->
  <div class="val-panel collapsed" id="val-panel">
    <div class="val-panel-header" id="val-panel-toggle">
      <div class="val-panel-title">
        Validation
        <span id="val-summary"></span>
      </div>
      <span class="val-toggle">&#9660;</span>
    </div>
    <div class="val-list" id="val-list"></div>
  </div>

  <!-- ── Status bar ── -->
  <div class="statusbar">
    <div class="status-msg">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>
    <span id="status-right"></span>
  </div>

</div>

<script>
(function () {
  'use strict';

  const inputEl      = document.getElementById('input');
  const outputCode   = document.getElementById('output-code');
  const emptyState   = document.getElementById('empty-state');
  const inputCount   = document.getElementById('input-count');
  const outputCount  = document.getElementById('output-count');
  const statusDot    = document.getElementById('status-dot');
  const statusText   = document.getElementById('status-text');
  const statusRight  = document.getElementById('status-right');
  const modeSelect   = document.getElementById('mode');
  const indentInput  = document.getElementById('indent-size');
  const inputGutter  = document.getElementById('input-gutter');
  const btnFormat    = document.getElementById('btn-format');
  const btnClear     = document.getElementById('btn-clear');
  const btnCopy      = document.getElementById('btn-copy');
  const btnPaste     = document.getElementById('btn-paste');
  const btnValidate  = document.getElementById('btn-validate');
  const valPanel     = document.getElementById('val-panel');
  const valList      = document.getElementById('val-list');
  const valSummary   = document.getElementById('val-summary');
  const valToggle    = document.getElementById('val-panel-toggle');

  let lastFormatted = '';

  // ── Input line-number gutter ──────────────────────────────────────────────
  function updateGutter() {
    const count = inputEl.value ? inputEl.value.split('\n').length : 1;
    if (parseInt(inputGutter.dataset.lines, 10) === count) return; // no change
    inputGutter.dataset.lines = count;
    inputGutter.innerHTML = Array.from({ length: count }, (_, i) => `<div>${i + 1}</div>`).join('');
  }

  inputEl.addEventListener('scroll', () => { inputGutter.scrollTop = inputEl.scrollTop; });
  updateGutter();

  // ── Detect language from content ──────────────────────────────────────────
  function detectMode(code) {
    const trimmed = code.trim();
    // Looks like CSS if it has { } blocks but no < tags
    if (!trimmed.startsWith('<') && /[a-z-]+\s*\{[^}]*\}/i.test(trimmed)) return 'css';
    return 'html';
  }

  // ── Format ────────────────────────────────────────────────────────────────
  function format() {
    const raw  = inputEl.value;
    if (!raw.trim()) {
      setStatus('', 'Nothing to format', false);
      return;
    }

    const indentSize = Math.max(1, Math.min(8, parseInt(indentInput.value, 10) || 2));

    // Auto-detect if user hasn't manually changed the select after typing
    const mode = modeSelect.value;

    try {
      let result;
      const t0 = performance.now();

      if (mode === 'css') {
        result = css_beautify(raw, {
          indent_size: indentSize,
          selector_separator_newline: true,
          end_with_newline: true,
          newline_between_rules: true,
        });
      } else {
        // HTML beautify options tuned for email code
        result = html_beautify(raw, {
          indent_size:              indentSize,
          wrap_line_length:         0,
          preserve_newlines:        false,
          max_preserve_newlines:    1,
          indent_inner_html:        true,
          end_with_newline:         false,
          extra_liners:             ['head', 'body', '/html'],
          inline:                   [],           // treat ALL tags as block — better for email
          unformatted:              [],
          content_unformatted:      ['pre', 'textarea'],
          wrap_attributes:          'auto',
        });
      }

      const elapsed = (performance.now() - t0).toFixed(1);
      lastFormatted  = result;

      // Syntax highlight
      const lang = mode === 'css' ? 'css' : 'markup';
      outputCode.className = `language-${lang}`;
      outputCode.textContent = result;
      Prism.highlightElement(outputCode);

      emptyState.style.display = 'none';
      outputCount.textContent  = `${result.length.toLocaleString()} chars`;
      setStatus('ok', `Formatted in ${elapsed} ms`, true);
      statusRight.textContent = `${countLines(result)} lines`;

    } catch (err) {
      setStatus('err', `Error: ${err.message}`, false);
    }
  }

  function countLines(str) {
    return (str.match(/\n/g) || []).length + 1;
  }

  function setStatus(type, msg, ok) {
    statusDot.className = 'status-dot' + (type ? ` ${type}` : '');
    statusText.textContent = msg;
  }

  // ── Char counter ──────────────────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    const n = inputEl.value.length;
    inputCount.textContent = n ? `${n.toLocaleString()} chars` : '0 chars';
    updateGutter();

    // Auto-detect mode based on content
    if (inputEl.value.trim()) {
      modeSelect.value = detectMode(inputEl.value);
    }
  });

  // ── Tab key in textarea ───────────────────────────────────────────────────
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = inputEl.selectionStart;
      const indent = ' '.repeat(parseInt(indentInput.value, 10) || 2);
      inputEl.setRangeText(indent, s, s, 'end');
    }
    // Ctrl/Cmd + Enter to format
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      format();
    }
  });

  // ── Buttons ───────────────────────────────────────────────────────────────
  btnFormat.addEventListener('click', format);

  btnClear.addEventListener('click', () => {
    inputEl.value        = '';
    updateGutter();
    outputCode.textContent = '';
    emptyState.style.display = '';
    inputCount.textContent   = '0 chars';
    outputCount.textContent  = '';
    statusRight.textContent  = '';
    lastFormatted = '';
    valList.innerHTML = '';
    valSummary.innerHTML = '';
    valPanel.classList.add('collapsed');
    setStatus('', 'Ready', false);
  });

  btnCopy.addEventListener('click', async () => {
    if (!lastFormatted) return;
    try {
      await navigator.clipboard.writeText(lastFormatted);
      const orig = btnCopy.textContent;
      btnCopy.textContent = '✓ Copied!';
      btnCopy.classList.add('btn-success');
      setTimeout(() => {
        btnCopy.textContent = orig;
        btnCopy.classList.remove('btn-success');
      }, 1800);
    } catch {
      setStatus('err', 'Clipboard access denied — select and copy manually', false);
    }
  });

  btnPaste.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      inputEl.value = text;
      inputEl.dispatchEvent(new Event('input'));
      format();
    } catch {
      setStatus('err', 'Clipboard read denied — paste manually with Ctrl+V', false);
    }
  });

  // ── Validate ─────────────────────────────────────────────────────────────
  function validate() {
    const raw = inputEl.value;
    if (!raw.trim()) {
      setStatus('', 'Nothing to validate', false);
      return;
    }

    const issues = runChecks(raw);
    renderIssues(issues);

    // Open the panel
    valPanel.classList.remove('collapsed');
  }

  // ── Line-number helpers ───────────────────────────────────────────────────
  function lineOf(raw, index) {
    return raw.substring(0, index).split('\n').length;
  }

  // Run a regex against raw and return [{match, line}] for every hit.
  // Always uses the 'g' flag internally.
  function matchAll(raw, re) {
    const g = new RegExp(re.source, re.flags.includes('g') ? re.flags : re.flags + 'g');
    const results = [];
    let m;
    while ((m = g.exec(raw)) !== null) results.push({ match: m[0], line: lineOf(raw, m.index) });
    return results;
  }

  function fmtLines(lines) {
    if (!lines.length) return '';
    const uniq = [...new Set(lines)].sort((a, b) => a - b);
    if (uniq.length === 1) return `line ${uniq[0]}`;
    if (uniq.length <= 4)  return `lines ${uniq.join(', ')}`;
    return `lines ${uniq.slice(0, 3).join(', ')} +${uniq.length - 3} more`;
  }

  function runChecks(raw) {
    const issues = [];

    function add(level, msg, hint, lines) {
      issues.push({ level, msg, hint, lines: lines || [] });
    }

    // ── Errors ────────────────────────────────────────────────────────────

    const scriptTags = matchAll(raw, /<script\b[^>]*>/i);
    if (scriptTags.length) {
      add('error', `${scriptTags.length} <script> tag${scriptTags.length > 1 ? 's' : ''}`,
        'JavaScript is blocked by virtually all email clients.',
        scriptTags.map(h => h.line));
    }

    const extLinks = matchAll(raw, /<link\b[^>]*\brel\s*=\s*["']?stylesheet[^>]*>/i);
    if (extLinks.length) {
      add('error', `${extLinks.length} external stylesheet <link>`,
        'External CSS is stripped by most email clients. Use inline styles.',
        extLinks.map(h => h.line));
    }

    // ── Warnings ──────────────────────────────────────────────────────────

    const allImgs = matchAll(raw, /<img\b[^>]*\/?>/i);

    const noAlt = allImgs.filter(h => !/\balt\s*=/i.test(h.match));
    if (noAlt.length) {
      add('warn', `${noAlt.length} <img> missing alt`,
        'Alt text is shown when images are blocked and is required for accessibility.',
        noAlt.map(h => h.line));
    }

    const noWidth = allImgs.filter(h => !/\bwidth\s*=/i.test(h.match));
    if (noWidth.length) {
      add('warn', `${noWidth.length} <img> missing width`,
        'Missing width causes layout shifts in clients that block images by default.',
        noWidth.map(h => h.line));
    }

    const allTables = matchAll(raw, /<table\b[^>]*>/i);

    const noRole = allTables.filter(h => !/\brole\s*=/i.test(h.match));
    if (noRole.length) {
      add('warn', `${noRole.length} <table> missing role="presentation"`,
        'Helps screen readers skip layout tables.',
        noRole.map(h => h.line));
    }

    const noCP = allTables.filter(h => !/\bcellpadding\s*=/i.test(h.match));
    if (noCP.length) {
      add('warn', `${noCP.length} <table> missing cellpadding="0"`,
        'Some email clients add default cell padding, causing unwanted spacing.',
        noCP.map(h => h.line));
    }

    const noCS = allTables.filter(h => !/\bcellspacing\s*=/i.test(h.match));
    if (noCS.length) {
      add('warn', `${noCS.length} <table> missing cellspacing="0"`,
        'Some email clients add default cell spacing, causing unwanted gaps.',
        noCS.map(h => h.line));
    }

    // Flexbox / Grid in inline styles
    const flexInline = matchAll(raw, /style\s*=\s*["'][^"']*display\s*:\s*(flex|grid|inline-flex|inline-grid)/i);
    if (flexInline.length) {
      add('warn', `Flexbox/Grid in ${flexInline.length} inline style${flexInline.length > 1 ? 's' : ''}`,
        'Very limited support in Outlook and older email clients.',
        flexInline.map(h => h.line));
    }

    // Flexbox / Grid inside <style> blocks
    const styleBlockRe = /<style\b[^>]*>([\s\S]*?)<\/style>/gi;
    const flexStyleLines = [];
    let sb;
    while ((sb = styleBlockRe.exec(raw)) !== null) {
      const blockOffset = sb.index + sb[0].indexOf('>') + 1;
      const flexRe = /display\s*:\s*(flex|grid|inline-flex|inline-grid)/gi;
      let fm;
      while ((fm = flexRe.exec(sb[1])) !== null) {
        flexStyleLines.push(lineOf(raw, blockOffset + fm.index));
      }
    }
    if (flexStyleLines.length) {
      add('warn', `Flexbox/Grid in <style> block`,
        'Very limited support in Outlook and older email clients.',
        flexStyleLines);
    }

    // position: fixed / absolute in inline styles
    const posInline = matchAll(raw, /style\s*=\s*["'][^"']*position\s*:\s*(fixed|absolute)/i);
    if (posInline.length) {
      add('warn', `position: fixed/absolute in ${posInline.length} inline style${posInline.length > 1 ? 's' : ''}`,
        'Positioned elements behave unpredictably across email clients.',
        posInline.map(h => h.line));
    }

    // ── Info ──────────────────────────────────────────────────────────────

    if (!/^\s*<!doctype/i.test(raw)) {
      add('info', 'Missing <!DOCTYPE html>',
        'Helps ensure consistent rendering across email clients.', []);
    }

    const hasCharset  = matchAll(raw, /<meta\b[^>]*\bcharset\b[^>]*>/i);
    const hasHttpEq   = matchAll(raw, /<meta\b[^>]*\bhttp-equiv\s*=\s*["']?content-type[^>]*>/i);
    if (!hasCharset.length && !hasHttpEq.length) {
      add('info', 'Missing charset <meta> tag',
        'Add <meta charset="UTF-8"> to prevent character encoding issues.', []);
    }

    const hasViewport = matchAll(raw, /<meta\b[^>]*\bname\s*=\s*["']?viewport[^>]*>/i);
    if (!hasViewport.length) {
      add('info', 'Missing viewport <meta> tag',
        'Add <meta name="viewport" content="width=device-width, initial-scale=1"> for mobile.', []);
    }

    return issues;
  }

  function renderIssues(issues) {
    valList.innerHTML = '';

    const counts = { error: 0, warn: 0, info: 0 };
    issues.forEach(i => counts[i.level]++);

    const parts = [];
    if (counts.error) parts.push(`<span class="val-badge error">${counts.error} error${counts.error > 1 ? 's' : ''}</span>`);
    if (counts.warn)  parts.push(`<span class="val-badge warn">${counts.warn} warning${counts.warn > 1 ? 's' : ''}</span>`);
    if (counts.info)  parts.push(`<span class="val-badge info">${counts.info} info</span>`);
    if (!issues.length) parts.push('<span class="val-badge ok">&#10003; No issues found</span>');
    valSummary.innerHTML = parts.join(' ');

    if (!issues.length) {
      valList.innerHTML = '<div class="val-empty">&#10003; Looking good — no issues detected.</div>';
      return;
    }

    const icons = { error: '✕', warn: '⚠', info: 'ℹ' };
    issues.forEach(({ level, msg, hint, lines }) => {
      const lineLabel = fmtLines(lines);
      const row = document.createElement('div');
      row.className = `val-issue ${level}`;
      row.innerHTML =
        `<span class="val-icon">${icons[level]}</span>` +
        `<span class="val-msg">${msg}</span>` +
        (lineLabel ? `<span class="val-lines">${lineLabel}</span>` : '') +
        `<span class="val-hint">— ${hint}</span>`;
      valList.appendChild(row);
    });
  }

  btnValidate.addEventListener('click', validate);

  valToggle.addEventListener('click', () => {
    valPanel.classList.toggle('collapsed');
  });

  // ── Keyboard shortcut hint ────────────────────────────────────────────────
  btnFormat.setAttribute('data-tip', 'Format  (Ctrl+Enter)');

})();
</script>
</body>
</html>
