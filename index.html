<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML & CSS Formatter — Email Dev Tools</title>

  <!-- js-beautify for formatting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-css.min.js"></script>

  <!-- Prism for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2e3245;
      --accent:    #4f6ef7;
      --accent-h:  #6b86ff;
      --success:   #3ecf8e;
      --text:      #e2e4f0;
      --muted:     #7b82a0;
      --radius:    8px;
      --font-ui:   'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-code: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label.control-label {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    select, input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 5px 8px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--accent);
    }

    input[type="number"] {
      width: 56px;
      text-align: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-family: var(--font-ui);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-h); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

    .btn-success {
      background: var(--success);
      color: #0f1117;
    }

    /* ── Panels ── */
    .panels {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    .panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .panel + .panel {
      border-left: 2px solid var(--border);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .panel-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .char-count {
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Input textarea ── */
    #input {
      flex: 1;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: none;
      outline: none;
      resize: none;
      padding: 16px;
      font-family: var(--font-code);
      font-size: 13px;
      line-height: 1.6;
      tab-size: 2;
    }

    #input::placeholder { color: var(--muted); }

    /* ── Output area ── */
    .output-wrap {
      flex: 1;
      overflow: auto;
      background: var(--bg);
      position: relative;
    }

    #output {
      margin: 0;
      padding: 16px;
      font-family: var(--font-code);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
      min-height: 100%;
      background: transparent;
    }

    /* Override Prism background */
    #output code[class*="language-"],
    #output pre[class*="language-"] {
      background: transparent !important;
      margin: 0;
      padding: 0;
      font-size: inherit;
      line-height: inherit;
    }

    /* Empty state */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      pointer-events: none;
    }

    .empty-state-icon { font-size: 32px; opacity: 0.4; }
    .empty-state-text { font-size: 13px; }

    /* ── Status bar ── */
    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .status-msg {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status-dot.ok  { background: var(--success); }
    .status-dot.err { background: #f56565; }

    /* ── Tooltip ── */
    [data-tip] { position: relative; }
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #2e3245;
      color: var(--text);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    [data-tip]:hover::after { opacity: 1; }

    /* ── Validation panel ── */
    .val-panel {
      background: var(--surface);
      border-top: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      max-height: 220px;
      transition: max-height 0.2s ease;
      overflow: hidden;
    }

    .val-panel.collapsed { max-height: 36px; }

    .val-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
      min-height: 36px;
    }

    .val-panel-header:hover { background: rgba(255,255,255,0.03); }

    .val-panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .val-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 7px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
    }

    .val-badge.error  { background: rgba(245,101,101,0.18); color: #f56565; }
    .val-badge.warn   { background: rgba(246,173,85,0.18);  color: #f6ad55; }
    .val-badge.info   { background: rgba(99,179,237,0.18);  color: #63b3ed; }
    .val-badge.ok     { background: rgba(62,207,142,0.15);  color: var(--success); }

    .val-toggle {
      font-size: 10px;
      color: var(--muted);
      transition: transform 0.2s;
    }

    .val-panel.collapsed .val-toggle { transform: rotate(-90deg); }

    .val-list {
      overflow-y: auto;
      padding: 0 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .val-issue {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 12px;
      line-height: 1.5;
    }

    .val-icon { flex-shrink: 0; font-size: 11px; }
    .val-issue.error .val-icon { color: #f56565; }
    .val-issue.warn  .val-icon { color: #f6ad55; }
    .val-issue.info  .val-icon { color: #63b3ed; }

    .val-msg  { color: var(--text); }
    .val-hint { color: var(--muted); }

    .val-empty {
      font-size: 12px;
      color: var(--success);
      padding: 4px 0 8px;
    }

    @media (max-width: 700px) {
      .panels { flex-direction: column; }
      .panel + .panel { border-left: none; border-top: 2px solid var(--border); }
      .controls { gap: 6px; }
      .control-group { display: none; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Header ── -->
  <header>
    <div class="logo">
      <div class="logo-icon">&#10094;/&#10095;</div>
      HTML &amp; CSS Formatter
    </div>

    <div class="controls">
      <div class="control-group">
        <label class="control-label" for="mode">Mode</label>
        <select id="mode">
          <option value="html">HTML</option>
          <option value="css">CSS</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label" for="indent-size">Indent</label>
        <input id="indent-size" type="number" value="2" min="1" max="8">
      </div>

<button class="btn btn-ghost" id="btn-clear" data-tip="Clear both panels">Clear</button>
      <button class="btn btn-ghost"  id="btn-validate" data-tip="Validate for email issues">Validate</button>
      <button class="btn btn-primary" id="btn-format">&#9654; Format</button>
    </div>
  </header>

  <!-- ── Panels ── -->
  <div class="panels">

    <!-- Input -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Input — paste your code here</span>
        <div class="panel-actions">
          <span class="char-count" id="input-count">0 chars</span>
          <button class="btn btn-ghost" id="btn-paste" data-tip="Paste from clipboard" style="padding:4px 10px;font-size:12px;">Paste</button>
        </div>
      </div>
      <textarea id="input" spellcheck="false"
        placeholder="Paste your messy HTML or CSS here…&#10;&#10;Tip: inline styles, nested tables, and email boilerplate are all handled."></textarea>
    </div>

    <!-- Output -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Output — formatted &amp; highlighted</span>
        <div class="panel-actions">
          <span class="char-count" id="output-count"></span>
          <button class="btn btn-ghost" id="btn-copy" data-tip="Copy formatted code" style="padding:4px 10px;font-size:12px;">Copy</button>
        </div>
      </div>
      <div class="output-wrap">
        <div class="empty-state" id="empty-state">
          <div class="empty-state-icon">&#9707;</div>
          <div class="empty-state-text">Formatted output will appear here</div>
        </div>
        <pre id="output"><code id="output-code" class="language-markup"></code></pre>
      </div>
    </div>

  </div>

  <!-- ── Validation panel ── -->
  <div class="val-panel collapsed" id="val-panel">
    <div class="val-panel-header" id="val-panel-toggle">
      <div class="val-panel-title">
        Validation
        <span id="val-summary"></span>
      </div>
      <span class="val-toggle">&#9660;</span>
    </div>
    <div class="val-list" id="val-list"></div>
  </div>

  <!-- ── Status bar ── -->
  <div class="statusbar">
    <div class="status-msg">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>
    <span id="status-right"></span>
  </div>

</div>

<script>
(function () {
  'use strict';

  const inputEl      = document.getElementById('input');
  const outputCode   = document.getElementById('output-code');
  const emptyState   = document.getElementById('empty-state');
  const inputCount   = document.getElementById('input-count');
  const outputCount  = document.getElementById('output-count');
  const statusDot    = document.getElementById('status-dot');
  const statusText   = document.getElementById('status-text');
  const statusRight  = document.getElementById('status-right');
  const modeSelect   = document.getElementById('mode');
  const indentInput  = document.getElementById('indent-size');
  const btnFormat    = document.getElementById('btn-format');
  const btnClear     = document.getElementById('btn-clear');
  const btnCopy      = document.getElementById('btn-copy');
  const btnPaste     = document.getElementById('btn-paste');
  const btnValidate  = document.getElementById('btn-validate');
  const valPanel     = document.getElementById('val-panel');
  const valList      = document.getElementById('val-list');
  const valSummary   = document.getElementById('val-summary');
  const valToggle    = document.getElementById('val-panel-toggle');

  let lastFormatted = '';

  // ── Detect language from content ──────────────────────────────────────────
  function detectMode(code) {
    const trimmed = code.trim();
    // Looks like CSS if it has { } blocks but no < tags
    if (!trimmed.startsWith('<') && /[a-z-]+\s*\{[^}]*\}/i.test(trimmed)) return 'css';
    return 'html';
  }

  // ── Format ────────────────────────────────────────────────────────────────
  function format() {
    const raw  = inputEl.value;
    if (!raw.trim()) {
      setStatus('', 'Nothing to format', false);
      return;
    }

    const indentSize = Math.max(1, Math.min(8, parseInt(indentInput.value, 10) || 2));

    // Auto-detect if user hasn't manually changed the select after typing
    const mode = modeSelect.value;

    try {
      let result;
      const t0 = performance.now();

      if (mode === 'css') {
        result = css_beautify(raw, {
          indent_size: indentSize,
          selector_separator_newline: true,
          end_with_newline: true,
          newline_between_rules: true,
        });
      } else {
        // HTML beautify options tuned for email code
        result = html_beautify(raw, {
          indent_size:              indentSize,
          wrap_line_length:         0,
          preserve_newlines:        false,
          max_preserve_newlines:    1,
          indent_inner_html:        true,
          end_with_newline:         false,
          extra_liners:             ['head', 'body', '/html'],
          inline:                   [],           // treat ALL tags as block — better for email
          unformatted:              [],
          content_unformatted:      ['pre', 'textarea'],
          wrap_attributes:          'auto',
        });
      }

      const elapsed = (performance.now() - t0).toFixed(1);
      lastFormatted  = result;

      // Syntax highlight
      const lang = mode === 'css' ? 'css' : 'markup';
      outputCode.className = `language-${lang}`;
      outputCode.textContent = result;
      Prism.highlightElement(outputCode);

      emptyState.style.display = 'none';
      outputCount.textContent  = `${result.length.toLocaleString()} chars`;
      setStatus('ok', `Formatted in ${elapsed} ms`, true);
      statusRight.textContent = `${countLines(result)} lines`;

    } catch (err) {
      setStatus('err', `Error: ${err.message}`, false);
    }
  }

  function countLines(str) {
    return (str.match(/\n/g) || []).length + 1;
  }

  function setStatus(type, msg, ok) {
    statusDot.className = 'status-dot' + (type ? ` ${type}` : '');
    statusText.textContent = msg;
  }

  // ── Char counter ──────────────────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    const n = inputEl.value.length;
    inputCount.textContent = n ? `${n.toLocaleString()} chars` : '0 chars';

    // Auto-detect mode based on content
    if (inputEl.value.trim()) {
      modeSelect.value = detectMode(inputEl.value);
    }
  });

  // ── Tab key in textarea ───────────────────────────────────────────────────
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = inputEl.selectionStart;
      const indent = ' '.repeat(parseInt(indentInput.value, 10) || 2);
      inputEl.setRangeText(indent, s, s, 'end');
    }
    // Ctrl/Cmd + Enter to format
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      format();
    }
  });

  // ── Buttons ───────────────────────────────────────────────────────────────
  btnFormat.addEventListener('click', format);

  btnClear.addEventListener('click', () => {
    inputEl.value        = '';
    outputCode.textContent = '';
    emptyState.style.display = '';
    inputCount.textContent   = '0 chars';
    outputCount.textContent  = '';
    statusRight.textContent  = '';
    lastFormatted = '';
    valList.innerHTML = '';
    valSummary.innerHTML = '';
    valPanel.classList.add('collapsed');
    setStatus('', 'Ready', false);
  });

  btnCopy.addEventListener('click', async () => {
    if (!lastFormatted) return;
    try {
      await navigator.clipboard.writeText(lastFormatted);
      const orig = btnCopy.textContent;
      btnCopy.textContent = '✓ Copied!';
      btnCopy.classList.add('btn-success');
      setTimeout(() => {
        btnCopy.textContent = orig;
        btnCopy.classList.remove('btn-success');
      }, 1800);
    } catch {
      setStatus('err', 'Clipboard access denied — select and copy manually', false);
    }
  });

  btnPaste.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      inputEl.value = text;
      inputEl.dispatchEvent(new Event('input'));
      format();
    } catch {
      setStatus('err', 'Clipboard read denied — paste manually with Ctrl+V', false);
    }
  });

  // ── Validate ─────────────────────────────────────────────────────────────
  function validate() {
    const raw = inputEl.value;
    if (!raw.trim()) {
      setStatus('', 'Nothing to validate', false);
      return;
    }

    const issues = runChecks(raw);
    renderIssues(issues);

    // Open the panel
    valPanel.classList.remove('collapsed');
  }

  function runChecks(raw) {
    const issues = [];
    const parser = new DOMParser();
    const doc    = parser.parseFromString(raw, 'text/html');

    // ── Errors ────────────────────────────────────────────────────────────

    const scripts = doc.querySelectorAll('script');
    if (scripts.length) {
      issues.push({ level: 'error', msg: `${scripts.length} <script> tag${scripts.length > 1 ? 's' : ''} found`, hint: 'JavaScript is blocked by virtually all email clients.' });
    }

    const extLinks = [...doc.querySelectorAll('link[rel="stylesheet"]')];
    if (extLinks.length) {
      issues.push({ level: 'error', msg: `${extLinks.length} external stylesheet <link> found`, hint: 'External CSS is stripped by most email clients. Use inline styles instead.' });
    }

    // ── Warnings ──────────────────────────────────────────────────────────

    const imgs = [...doc.querySelectorAll('img')];

    const noAlt = imgs.filter(i => !i.hasAttribute('alt'));
    if (noAlt.length) {
      issues.push({ level: 'warn', msg: `${noAlt.length} <img> tag${noAlt.length > 1 ? 's' : ''} missing alt attribute`, hint: 'Alt text is shown when images are blocked and is required for accessibility.' });
    }

    const noWidth = imgs.filter(i => !i.hasAttribute('width'));
    if (noWidth.length) {
      issues.push({ level: 'warn', msg: `${noWidth.length} <img> tag${noWidth.length > 1 ? 's' : ''} missing width attribute`, hint: 'Missing width causes layout shifts in email clients that block images by default.' });
    }

    const tables = [...doc.querySelectorAll('table')];

    const noRole = tables.filter(t => !t.hasAttribute('role'));
    if (noRole.length) {
      issues.push({ level: 'warn', msg: `${noRole.length} <table> tag${noRole.length > 1 ? 's' : ''} missing role="presentation"`, hint: 'Add role="presentation" to layout tables so screen readers skip the table structure.' });
    }

    const noCellpadding = tables.filter(t => !t.hasAttribute('cellpadding'));
    if (noCellpadding.length) {
      issues.push({ level: 'warn', msg: `${noCellpadding.length} <table> tag${noCellpadding.length > 1 ? 's' : ''} missing cellpadding="0"`, hint: 'Some email clients add default cell padding, causing unwanted spacing.' });
    }

    const noCellspacing = tables.filter(t => !t.hasAttribute('cellspacing'));
    if (noCellspacing.length) {
      issues.push({ level: 'warn', msg: `${noCellspacing.length} <table> tag${noCellspacing.length > 1 ? 's' : ''} missing cellspacing="0"`, hint: 'Some email clients add default cell spacing, causing unwanted gaps.' });
    }

    // Flexbox / Grid in inline styles
    const inlineStyleEls = [...doc.querySelectorAll('[style]')];
    const flexInline = inlineStyleEls.filter(el => /display\s*:\s*(flex|grid|inline-flex|inline-grid)/i.test(el.getAttribute('style')));
    if (flexInline.length) {
      issues.push({ level: 'warn', msg: `Flexbox or Grid used in ${flexInline.length} inline style${flexInline.length > 1 ? 's' : ''}`, hint: 'Flexbox and Grid have very limited support in Outlook and older email clients.' });
    }

    // Flexbox / Grid in <style> blocks
    const styleBlocks = [...doc.querySelectorAll('style')];
    let flexInStyle = false;
    styleBlocks.forEach(s => {
      if (/display\s*:\s*(flex|grid|inline-flex|inline-grid)/i.test(s.textContent)) flexInStyle = true;
    });
    if (flexInStyle) {
      issues.push({ level: 'warn', msg: 'Flexbox or Grid used in <style> block', hint: 'Flexbox and Grid have very limited support in Outlook and older email clients.' });
    }

    // position: fixed / absolute
    const posInline = inlineStyleEls.filter(el => /position\s*:\s*(fixed|absolute)/i.test(el.getAttribute('style')));
    if (posInline.length) {
      issues.push({ level: 'warn', msg: `position: fixed/absolute found in ${posInline.length} inline style${posInline.length > 1 ? 's' : ''}`, hint: 'Positioned elements behave unpredictably across email clients.' });
    }

    // ── Info ──────────────────────────────────────────────────────────────

    if (!/^\s*<!doctype/i.test(raw)) {
      issues.push({ level: 'info', msg: 'Missing <!DOCTYPE html>', hint: 'A doctype declaration helps ensure consistent rendering across email clients.' });
    }

    if (!doc.querySelector('meta[charset]') && !doc.querySelector('meta[http-equiv="Content-Type"]')) {
      issues.push({ level: 'info', msg: 'Missing charset <meta> tag', hint: 'Add <meta charset="UTF-8"> to prevent character encoding issues.' });
    }

    if (!doc.querySelector('meta[name="viewport"]')) {
      issues.push({ level: 'info', msg: 'Missing viewport <meta> tag', hint: 'Add <meta name="viewport" content="width=device-width, initial-scale=1"> for mobile rendering.' });
    }

    return issues;
  }

  function renderIssues(issues) {
    valList.innerHTML = '';

    const counts = { error: 0, warn: 0, info: 0 };
    issues.forEach(i => counts[i.level]++);

    // Summary badges
    const parts = [];
    if (counts.error) parts.push(`<span class="val-badge error">${counts.error} error${counts.error > 1 ? 's' : ''}</span>`);
    if (counts.warn)  parts.push(`<span class="val-badge warn">${counts.warn} warning${counts.warn > 1 ? 's' : ''}</span>`);
    if (counts.info)  parts.push(`<span class="val-badge info">${counts.info} info</span>`);
    if (!issues.length) parts.push('<span class="val-badge ok">&#10003; No issues found</span>');
    valSummary.innerHTML = parts.join(' ');

    if (!issues.length) {
      valList.innerHTML = '<div class="val-empty">&#10003; Looking good — no issues detected.</div>';
      return;
    }

    const icons = { error: '✕', warn: '⚠', info: 'ℹ' };
    issues.forEach(({ level, msg, hint }) => {
      const row = document.createElement('div');
      row.className = `val-issue ${level}`;
      row.innerHTML = `<span class="val-icon">${icons[level]}</span><span class="val-msg">${msg}</span><span class="val-hint">— ${hint}</span>`;
      valList.appendChild(row);
    });
  }

  btnValidate.addEventListener('click', validate);

  valToggle.addEventListener('click', () => {
    valPanel.classList.toggle('collapsed');
  });

  // ── Keyboard shortcut hint ────────────────────────────────────────────────
  btnFormat.setAttribute('data-tip', 'Format  (Ctrl+Enter)');

})();
</script>
</body>
</html>
